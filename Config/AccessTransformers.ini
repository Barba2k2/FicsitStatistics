[AccessTransformers]
; Real production counting hooks the (protected) per-cycle functions of factories.
Friend=(Class="AFGBuildableFactory", FriendClass="FFicsitEventCounters")
Friend=(Class="AFGBuildableManufacturer", FriendClass="FFicsitEventCounters")
; Dismantle refunds are measured around the (private) server dismantle RPC.
Friend=(Class="UFGBuildGunStateDismantle", FriendClass="FFicsitEventCounters")
; Power totals come from the game's own circuits (private list).
Friend=(Class="AFGCircuitSubsystem", FriendClass="AFicsitStatisticsSubsystem")
